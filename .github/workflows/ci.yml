name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always
  # Build dependencies shared by every Linux job, written once.
  LINUX_DEPS: >-
    nasm libasound2-dev libva-dev libfontconfig1-dev libgbm-dev libxcb1-dev
    libglib2.0-dev libpango1.0-dev libgdk-pixbuf-2.0-dev libgtk-4-dev
    libpipewire-0.3-dev libudev-dev libegl-dev libwayland-dev libxkbcommon-dev
    mesa-vulkan-drivers libvulkan1

jobs:
  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `shaderloom` compiles WGSL to DXIL on Windows through `dxc`
      - name: Install DirectX Shader Compiler
        if: runner.os == 'Windows'
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-targets --all-features --no-tests warn

  # The Linux leg runs in a container rather than on the runner: the `dma_buf`
  # tests assert the DMA-BUF import extensions, and the Mesa shipped with
  # ubuntu-latest is too old to expose them — lavapipe only gained
  # `VK_EXT_external_memory_dma_buf` in Mesa 26. Running the tests against the
  # stock host Mesa would fail them, not skip them, so they run where the
  # extension set exists. `/dev/udmabuf` must exist on the host before the
  # container starts, hence the `modprobe` outside the container.
  test-linux:
    name: Test / ubuntu-latest
    runs-on: ubuntu-latest
    env:
      IMAGE: ubuntu:26.04
      # What the container needs on top of LINUX_DEPS: a C toolchain and curl
      # for rustup (the GHA runner provides these, a bare image does not), and
      # the GL runtime half of the interop — EGL and GLES on Mesa's llvmpipe.
      CONTAINER_DEPS: >-
        build-essential pkg-config curl ca-certificates
        libegl1 libgles2 libgl1-mesa-dri
    steps:
      - uses: actions/checkout@v4
      # The `dma_buf` tests allocate their buffers through `udmabuf`. The
      # runner's Azure kernel carries the module only in its
      # `linux-modules-extra` package, and does not load it by default.
      - name: Load the udmabuf module
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe udmabuf
      - name: Run the tests
        run: |
          docker run --rm \
            --device /dev/udmabuf \
            -e CARGO_TERM_COLOR \
            -e CARGO_INCREMENTAL \
            -e CARGO_PROFILE_DEV_DEBUG \
            -e CARGO_PROFILE_TEST_DEBUG \
            -e LINUX_DEPS \
            -e CONTAINER_DEPS \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$IMAGE" \
            sh -eux -c '
              apt-get update
              apt-get install -y --no-install-recommends $LINUX_DEPS $CONTAINER_DEPS
              curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              . "$HOME/.cargo/env"
              curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C /usr/local/bin
              cargo nextest run --workspace --all-targets --all-features --no-tests warn
            '

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # The Lint job runs on Linux, where the Apple module is compiled out, so the
  # Apple targets are linted here. The iOS targets cannot run on a hosted
  # runner, so their test binaries are built and linked rather than run.
  lint-apple:
    name: Lint / ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo clippy --workspace --all-targets --all-features --target ${{ matrix.target }} -- -D warnings
      - name: Build the iOS test binaries
        if: matrix.target != 'aarch64-apple-darwin'
        run: cargo test --workspace --all-features --target ${{ matrix.target }} --no-run

  # The Android module is compiled out everywhere else. Its import tests need
  # an Android device's GPU and gralloc, so CI lints the Android build and
  # links the test binary; the tests run on hardware.
  lint-android:
    name: Lint / aarch64-linux-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - run: cargo ndk --target arm64-v8a --platform 29 clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build the Android test binaries
        run: cargo ndk --target arm64-v8a --platform 29 test --workspace --all-features --no-run

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The floor is whatever `Cargo.toml` declares, read here rather than
      # written twice: a hardcoded version in CI drifts from the manifest and
      # then gates a number nobody declared.
      - name: Read rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml declares no rust-version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Installing a toolchain is not building with it: the action only
          # sets the rustup default, and this repository's
          # `rust-toolchain.toml` overrides the default for every cargo
          # invocation inside the checkout. Without this env var the job
          # compiled on `stable` and proved nothing about the floor.
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS
      - uses: Swatinem/rust-cache@v2
      # Proof in the log that the floor is what compiled, so a later change to
      # the pin or the action cannot quietly make this a second stable run.
      - name: Show the toolchain this job builds with
        run: rustc --version && cargo --version
      - run: cargo check --workspace --all-features
