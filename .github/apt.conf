// apt has no overall deadline: a mirror connection that stalls after the
// handshake holds `apt-get update` until the job's own timeout (CI run
// 37679153561 sat on one for an hour). Every workflow's apt calls read this
// file, so each connection is bounded and retried.
Acquire::Retries "3";
Acquire::http::Timeout "30";
Acquire::https::Timeout "30";
